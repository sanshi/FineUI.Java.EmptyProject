server.port=8083

# 首页路由：GET / 重定向到 /index（对应 @FineUIPage("index") 的框架页首页）
fineui.home=index

# ===== FineUI 全局配置（fineui.* → 全站默认） =====
# 全局主题（切换 themes/{theme}/theme.css）
fineui.theme=pure_black
# 是否启用动画效果（选项卡、窗口等）
fineui.enable-animation=false
# 是否使用自定义美化滚动条
fineui.custom-scrollbar=false
# 是否启用移动浏览器自适应
fineui.mobile-adaption=false

# 页面脚本仅允许同源文件与可信模板的逐请求 nonce；不放行内联事件属性或字符串代码执行。
fineui.csp-scripts=true
fineui.csp-allow-self=true
fineui.csp-allow-nonce=true
fineui.csp-allow-unsafe-inline=false
fineui.csp-allow-unsafe-eval=false

# 开发期关闭模板缓存，改模板即时生效
spring.thymeleaf.cache=false
